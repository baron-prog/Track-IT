<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex"
  >

  <title>
    Track IT
  </title>

</head>


<body>


<script>

(function () {

  const match =
    window.location.pathname.match(
      /^\/track\/([^/]+)\/?$/i
    );


  if (match) {

    let code =
      match[1];


    try {

      code =
        decodeURIComponent(code);

    } catch (e) {}


    window.location.replace(
      '/?tracking=' +
      encodeURIComponent(code)
    );


    return;

  }


  window.location.replace('/');

})();

</script>


</body>

</html>
